<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Привычки">
<meta name="theme-color" content="#F5F5F7">
<title>Мой трекер привычек</title>
<style>
:root{--bg:#F5F5F7;--card:#fff;--text:#1D1D1F;--muted:#6E6E73;--accent:#0071E3;--accent-soft:#E8F1FD;--line:#E5E5EA;--ok:#1E8E3E;--shadow:0 4px 20px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--text:#F5F5F7;--muted:#98989D;--accent:#2997FF;--accent-soft:#0F2740;--line:#2C2C2E;--ok:#30D158;--shadow:none}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.4;padding:max(20px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:15px;margin-top:2px}
.card{background:var(--card);border-radius:22px;padding:18px 18px;box-shadow:var(--shadow)}
.label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pts{font-size:34px;font-weight:800;letter-spacing:-.02em}
.chip{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:999px;padding:4px 12px;font-size:14px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .4s}
.hint{color:var(--muted);font-size:14px;margin-top:8px}
.habit{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:18px;font-weight:600;padding:16px;border-radius:18px;margin-top:10px;cursor:pointer}
.habit .box{flex:none;width:32px;height:32px;border-radius:16px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.habit.on{border-color:var(--accent);background:var(--accent-soft)}
.habit.on .box{background:var(--accent);border-color:var(--accent)}
.habit small{display:block;color:var(--muted);font-weight:400;font-size:14px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.dot{border:0;background:var(--line);color:var(--muted);border-radius:14px;padding:8px 0 6px;font:inherit;font-size:12px;text-align:center;cursor:pointer}
.dot b{display:block;font-size:17px;color:var(--text);margin-top:2px}
.dot.done{background:var(--accent);color:#fff}.dot.done b{color:#fff}
.dot.sel{outline:3px solid var(--accent);outline-offset:2px}
.dot.off{opacity:.35;cursor:default}
.nav{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;font-size:22px;padding:2px 10px;cursor:pointer}
.nav[disabled]{opacity:.25}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{border-radius:14px;padding:8px 12px;font-size:14px;font-weight:700;background:var(--line);color:var(--muted)}
.badge.got{background:var(--accent-soft);color:var(--accent)}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
textarea,select,input[type=number]{width:100%;font:inherit;font-size:17px;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px}
textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-size:18px;font-weight:700;background:var(--accent);color:#fff;margin-top:14px;cursor:pointer}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn[disabled]{opacity:.45}
.ok{color:var(--ok);font-weight:700}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#1D1D1F;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%}
.toast.show{opacity:1}
.pre{white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:12px;padding:12px;margin-top:10px;max-height:240px;overflow:auto}
.warn{background:#FFF4D6;color:#6B4E00;border-radius:14px;padding:12px 14px;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
/*CORE*/
const LEVELS = [["Старт", 0], ["Разгон", 300], ["Ритм", 1000], ["Система", 2500], ["Мастер", 5000]];
const P_HABIT = 10, P_FULL = 20, P_CHECKIN = 50, P_CHALLENGE = 100;
const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const weekStart = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const ruDate = d => pad(d.getDate()) + "." + pad(d.getMonth() + 1);
const fullDate = d => pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear();

function emptyState() { return { days: {}, checkins: {}, challenge: {}, base: {} }; }
function dayMarks(st, key, n) { const a = st.days[key] || []; const out = []; for (let i = 0; i < n; i++) out.push(a[i] ? 1 : 0); return out; }
function dayPoints(marks) { const c = marks.reduce((a, b) => a + b, 0); return c * P_HABIT + (marks.length > 0 && c === marks.length ? P_FULL : 0); }
function isDone(st, key, n) { return dayMarks(st, key, n).some(Boolean); }
function totalPoints(st, n) {
  let t = 0;
  for (const k in st.days) t += dayPoints(dayMarks(st, k, n));
  t += P_CHECKIN * Object.keys(st.checkins).length;
  t += P_CHALLENGE * Object.keys(st.challenge).filter(k => st.challenge[k]).length;
  return t;
}
function levelInfo(p) {
  let i = 0;
  for (let j = 0; j < LEVELS.length; j++) if (p >= LEVELS[j][1]) i = j;
  const next = LEVELS[i + 1];
  return { name: LEVELS[i][0], index: i, next: next ? next[0] : null, from: LEVELS[i][1], to: next ? next[1] : null,
           progress: next ? (p - LEVELS[i][1]) / (next[1] - LEVELS[i][1]) : 1 };
}
function doneSet(st, n) { const s = new Set(); for (const k in st.days) if (isDone(st, k, n)) s.add(k); return s; }
// Серия: день засчитан, если отмечена хотя бы одна привычка. Один пропуск в любые 7 дней прощается.
function streak(set, today) {
  let d = today;
  if (!set.has(iso(d))) d = addDays(d, -1);
  let count = 0, lastForgive = null, i = 0;
  while (i < 800) {
    if (set.has(iso(d))) count++;
    else {
      if (lastForgive !== null && i - lastForgive < 7) break;
      lastForgive = i;
    }
    d = addDays(d, -1); i++;
  }
  return count;
}
function weekDoneCount(set, ws, today) { let c = 0; for (let i = 0; i < 7; i++) { const d = addDays(ws, i); if (d <= today && set.has(iso(d))) c++; } return c; }
function badges(set) {
  const dates = [...set].sort(); let back = false;
  for (let i = 1; i < dates.length; i++) if (Math.round((parse(dates[i]) - parse(dates[i - 1])) / 864e5) >= 3) back = true;
  const t = set.size;
  return [{ label: "7 дней", got: t >= 7 }, { label: "30 дней", got: t >= 30 }, { label: "66 дней", got: t >= 66 }, { label: "Вернулся", got: back }];
}
function weekSummary(st, habits, ws) {
  const n = habits.length, per = habits.map(() => 0); let full = 0, pts = 0;
  for (let i = 0; i < 7; i++) {
    const m = dayMarks(st, iso(addDays(ws, i)), n);
    m.forEach((v, j) => { per[j] += v; });
    if (n > 0 && m.every(Boolean)) full++;
    pts += dayPoints(m);
  }
  const key = iso(ws), ci = st.checkins[key], ch = !!st.challenge[key];
  if (ci) pts += P_CHECKIN;
  if (ch) pts += P_CHALLENGE;
  return { per, full, pts, ci: ci || null, ch };
}
const clean = s => String(s || "").replace(/[;\r\n\t]+/g, " ").trim();
function buildSummary(st, cfg, ws) {
  const w = weekSummary(st, cfg.habits, ws), total = totalPoints(st, cfg.habits.length), lv = levelInfo(total);
  const L = ["Трекер: " + cfg.name, "Неделя " + ruDate(ws) + " – " + ruDate(addDays(ws, 6))];
  cfg.habits.forEach((h, i) => L.push(h + ": " + w.per[i] + " из 7"));
  L.push("Полных дней: " + w.full);
  L.push("Очки за неделю: " + w.pts + ", всего: " + total + " (" + lv.name + ")");
  if (cfg.challenge) L.push("Челлендж: " + (w.ch ? "выполнен" : "не выполнен"));
  if (w.ci) {
    L.push("Что получилось: " + clean(w.ci.good));
    L.push("Что мешало: " + clean(w.ci.hard));
    L.push("Энергия: " + w.ci.energy + "/10, сон: " + w.ci.sleep + "/10");
    L.push("Цель на неделю: " + clean(w.ci.goal));
  } else L.push("Чек-ин не заполнен");
  const row = [fullDate(ws), "", cfg.habits[0] || "", w.per[0] ?? "", cfg.habits[1] || "", w.per[1] ?? "", w.full, w.pts, total,
               cfg.challenge ? (w.ch ? "да" : "нет") : "", w.ci ? clean(w.ci.good) : "", w.ci ? clean(w.ci.hard) : "",
               w.ci ? w.ci.energy : "", w.ci ? w.ci.sleep : "", w.ci ? clean(w.ci.goal) : ""];
  L.push("", "Строка для листа «Привычки» (ID добавит тренер):", row.join(";"));
  return L.join("\n");
}
function baseSummary(st, cfg) {
  const rows = Object.keys(st.base).sort().map(k => st.base[k]).filter(r => r && (r.sleep || r.steps || r.meals));
  const avg = f => { const v = rows.map(r => Number(r[f])).filter(x => x > 0); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; };
  const f1 = x => (Math.round(x * 10) / 10).toString().replace(".", ",");
  return ["Базовая неделя: " + cfg.name, "Дней заполнено: " + rows.length,
          "Сон в среднем: " + (avg("sleep") ? f1(avg("sleep")) + " ч" : "нет данных"),
          "Шагов в день: " + (avg("steps") ? Math.round(avg("steps")) : "нет данных"),
          "Приёмов пищи в день: " + (avg("meals") ? f1(avg("meals")) : "нет данных")].join("\n");
}
function parseConfig(hash) {
  const p = new URLSearchParams((hash || "").replace(/^#/, ""));
  const habits = (p.get("h") || "").split("|").map(s => s.trim()).filter(Boolean).slice(0, 2);
  return { name: (p.get("n") || "Друг").slice(0, 30), habits: habits.length ? habits : ["Моя привычка"], challenge: (p.get("ch") || "").slice(0, 140),
           ready: p.get("rd") === "2" ? 2 : (p.get("rd") === "1" ? 1 : 3), motiv: p.get("m") || "И", mode: p.get("mode") === "base" ? "base" : "main", demo: p.get("demo") === "1" };
}
/*ENDCORE*/

if (typeof document !== "undefined") {
(function () {
  const cfg = parseConfig(location.hash);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const N = cfg.habits.length;
  const KEY = "mt1:" + cfg.name + ":" + cfg.habits.join("|") + ":" + cfg.mode;
  let memoryOnly = false, st = emptyState();
  try { const raw = localStorage.getItem(KEY); if (raw) st = Object.assign(emptyState(), JSON.parse(raw)); } catch (e) { memoryOnly = true; }
  if (cfg.demo) {
    st = emptyState();
    for (let i = 0; i < 26; i++) { if (i % 7 === 4) continue; st.days[iso(addDays(today, -i))] = cfg.habits.map((_, j) => (i % 3 === 0 && j === 1 ? 0 : 1)); }
    st.checkins[iso(addDays(weekStart(today), -7))] = { good: "", hard: "", energy: 7, sleep: 6, goal: "" };
    st.base = {};
  }
  function save() { if (cfg.demo) return; try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { memoryOnly = true; } }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = id => document.getElementById(id);
  let viewWs = weekStart(today), sel = iso(today), lastText = "";
  const DOW = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2600); }
  async function send(text) {
    lastText = text;
    if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
    try { await navigator.clipboard.writeText(text); toast("Скопировано. Вставь в чат с тренером"); }
    catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("Скопировано. Вставь в чат с тренером"); } catch (e2) { toast("Выдели текст ниже и скопируй"); } ta.remove(); }
    const box = $("preview"); if (box) box.textContent = text;
  }
  function tip() {
    return '<div class="hint">Данные хранятся только на этом телефоне. Чтобы они не пропали, добавь страницу на экран «Домой»: кнопка «Поделиться» в Safari, затем «На экран Домой».</div>'
      + (memoryOnly ? '<div class="warn" style="margin-top:10px">Браузер не даёт сохранять отметки (приватный режим?). Открой страницу в обычном окне, иначе отметки пропадут.</div>' : "");
  }

  function renderBase() {
    const days = [0, 1, 2].map(i => addDays(today, -i)).reverse();
    $("app").innerHTML = '<div><h1>Привет, ' + esc(cfg.name) + '</h1><div class="sub">Базовая неделя: 3 дня живи как обычно и просто записывай</div></div>'
      + '<div class="card"><div class="label">Три дня без изменений</div>'
      + days.map(d => { const k = iso(d), r = st.base[k] || {};
          return '<div style="margin-top:14px"><b>' + ruDate(d) + (k === iso(today) ? " · сегодня" : "") + '</b><div class="two">'
            + '<div><label>Сон, часов</label><input type="number" inputmode="decimal" step="0.5" data-k="' + k + '" data-f="sleep" value="' + esc(r.sleep || "") + '"></div>'
            + '<div><label>Шагов за день</label><input type="number" inputmode="numeric" data-k="' + k + '" data-f="steps" value="' + esc(r.steps || "") + '"></div></div>'
            + '<label>Приёмов пищи (завтрак, обед, перекус считаются)</label><input type="number" inputmode="numeric" data-k="' + k + '" data-f="meals" value="' + esc(r.meals || "") + '"></div>'; }).join("")
      + '<button class="btn" id="sendBase">Отправить тренеру</button><div class="pre" id="preview" style="display:none"></div></div>'
      + '<div class="card"><div class="hint" style="margin-top:0">Ничего менять не нужно: тренеру важно увидеть твой обычный день. Это не оценка.</div></div>' + tip();
    document.querySelectorAll("input[data-k]").forEach(el => el.addEventListener("input", () => {
      const k = el.dataset.k; st.base[k] = st.base[k] || {}; st.base[k][el.dataset.f] = el.value; save(); }));
    $("sendBase").onclick = () => { $("preview").style.display = "block"; send(baseSummary(st, cfg)); };
  }

  function render() {
    if (cfg.mode === "base") return renderBase();
    const set = doneSet(st, N), total = totalPoints(st, N), lv = levelInfo(total), sk = streak(set, today);
    const selDate = parse(sel), wk = weekSummary(st, cfg.habits, viewWs), marks = dayMarks(st, sel, N), ws0 = iso(viewWs);
    const isCur = iso(viewWs) === iso(weekStart(today)), weekN = weekDoneCount(set, viewWs, today);
    const selLabel = sel === iso(today) ? "Сегодня" : (sel === iso(addDays(today, -1)) ? "Вчера" : selDate.getDate() + " " + MONTHS[selDate.getMonth()]);
    const full = N > 0 && marks.every(Boolean);
    let h = '<div><h1>Привет, ' + esc(cfg.name) + '</h1><div class="sub">Маленькие шаги каждый день</div></div>';
    h += '<div class="card"><div class="row"><div><div class="pts">' + total + '</div><div class="sub">очков</div></div><span class="chip">' + lv.name + '</span></div>'
      + '<div class="bar"><i style="width:' + Math.round(lv.progress * 100) + '%"></i></div>'
      + '<div class="hint">' + (lv.next ? 'До уровня «' + lv.next + '»: ' + (lv.to - total) : 'Высший уровень') + '</div></div>';
    h += '<div class="card"><div class="label">' + selLabel + '</div>'
      + cfg.habits.map((x, i) => '<button class="habit' + (marks[i] ? " on" : "") + '" data-i="' + i + '"><span class="box">' + (marks[i] ? "✓" : "") + '</span><span>' + esc(x) + '<small>+10 очков</small></span></button>').join("")
      + '<div class="hint">' + (full ? '<span class="ok">Полный день: +20 очков</span>' : "За полный день ещё +20") + '</div></div>';
    h += '<div class="card"><div class="row"><button class="nav" id="prev">‹</button><div class="label" style="margin:0">' + ruDate(viewWs) + ' – ' + ruDate(addDays(viewWs, 6)) + '</div><button class="nav" id="next"' + (isCur ? " disabled" : "") + '>›</button></div><div class="strip">'
      + DOW.map((n, i) => { const d = addDays(viewWs, i), k = iso(d), fut = d > today;
          return '<button class="dot' + (set.has(k) ? " done" : "") + (k === sel ? " sel" : "") + (fut ? " off" : "") + '" data-d="' + k + '"' + (fut ? " disabled" : "") + '>' + n + '<b>' + d.getDate() + '</b></button>'; }).join("")
      + '</div><div class="hint">'
      + (cfg.ready === 2 ? 'На этой неделе: <b>' + weekN + ' из 7</b>' : 'Серия: <b>' + sk + '</b> ' + (sk === 1 ? "день" : (sk >= 2 && sk <= 4 ? "дня" : "дней")) + ' · один пропуск не сбрасывает серию')
      + (cfg.motiv === "Ц" ? ' · выполнение недели: <b>' + Math.round(100 * wk.per.reduce((a, b) => a + b, 0) / (7 * N)) + '%</b>' : '') + '</div>'
      + '<div class="hint">Забыл отметить? Нажми на нужный день и отметь привычки.</div></div>';
    if (cfg.challenge) h += '<div class="card"><div class="label">Челлендж недели</div><div style="font-weight:600">' + esc(cfg.challenge) + '</div>'
      + '<button class="habit' + (wk.ch ? " on" : "") + '" id="chal"><span class="box">' + (wk.ch ? "✓" : "") + '</span><span>Выполнено<small>+100 очков</small></span></button></div>';
    h += '<div class="card"><div class="label">Значки</div><div class="badges">' + badges(set).map(b => '<span class="badge' + (b.got ? " got" : "") + '">' + (b.got ? "★ " : "") + b.label + '</span>').join("") + '</div>'
      + '<div class="hint">Дни считаются суммарно, а не подряд.</div></div>';
    const ci = wk.ci;
    h += '<div class="card"><div class="label">Чек-ин недели ' + ruDate(viewWs) + '</div>'
      + '<label>Что получилось</label><textarea id="ci_good">' + esc(ci ? ci.good : "") + '</textarea>'
      + '<label>Что мешало</label><textarea id="ci_hard">' + esc(ci ? ci.hard : "") + '</textarea><div class="two">'
      + '<div><label>Энергия, 1–10</label><select id="ci_energy">' + opts(ci && ci.energy) + '</select></div>'
      + '<div><label>Сон, 1–10</label><select id="ci_sleep">' + opts(ci && ci.sleep) + '</select></div></div>'
      + '<label>Цель на следующую неделю</label><textarea id="ci_goal">' + esc(ci ? ci.goal : "") + '</textarea>'
      + '<button class="btn ghost" id="saveCi">' + (ci ? "Обновить чек-ин" : "Сохранить чек-ин (+50 очков)") + '</button></div>';
    h += '<div class="card"><div class="label">Отправить тренеру</div><div class="hint" style="margin-top:0">Раз в неделю, в воскресенье или в понедельник. Выбери нужную неделю стрелками выше, нажми кнопку и отправь в чат.</div>'
      + '<button class="btn" id="send">Отправить тренеру</button><div class="pre" id="preview" style="display:none"></div></div>' + tip();
    $("app").innerHTML = h;
    document.querySelectorAll(".habit[data-i]").forEach(b => b.onclick = () => { const i = +b.dataset.i, m = dayMarks(st, sel, N); m[i] = m[i] ? 0 : 1; st.days[sel] = m; save(); render(); });
    document.querySelectorAll(".dot").forEach(b => b.onclick = () => { sel = b.dataset.d; render(); });
    $("prev").onclick = () => { viewWs = addDays(viewWs, -7); sel = iso(addDays(viewWs, 6)); render(); };
    $("next").onclick = () => { viewWs = addDays(viewWs, 7); const e = addDays(viewWs, 6); sel = iso(e > today ? today : e); render(); };
    if ($("chal")) $("chal").onclick = () => { st.challenge[ws0] = st.challenge[ws0] ? 0 : 1; save(); render(); };
    $("saveCi").onclick = () => {
      const e = $("ci_energy").value, s = $("ci_sleep").value;
      if (!e || !s) { toast("Выбери энергию и сон от 1 до 10"); return; }
      const fresh = !st.checkins[ws0];
      st.checkins[ws0] = { good: $("ci_good").value, hard: $("ci_hard").value, energy: +e, sleep: +s, goal: $("ci_goal").value };
      save(); render(); toast(fresh ? "Чек-ин сохранён: +50 очков" : "Чек-ин обновлён");
    };
    $("send").onclick = () => { $("preview").style.display = "block"; send(buildSummary(st, cfg, viewWs)); };
  }
  function opts(v) { let o = '<option value="">—</option>'; for (let i = 1; i <= 10; i++) o += '<option value="' + i + '"' + (+v === i ? " selected" : "") + '>' + i + '</option>'; return o; }
  render();
})();
}
if (typeof module !== "undefined") module.exports = { iso, parse, addDays, weekStart, dayPoints, totalPoints, levelInfo, doneSet, streak, weekDoneCount, badges, weekSummary, buildSummary, baseSummary, parseConfig, emptyState };
